name: 个人任务切片
description: 一人一条，对标 CoursePilot 的 [E1 草案]
title: "[A1][W1] "
labels: []
body:
  - type: dropdown
    id: owner
    attributes:
      label: 负责人
      options: [A, B, C, D, E, F]
    validations:
      required: true
  - type: dropdown
    id: week
    attributes:
      label: 周次
      options: [W1, W2, W3, W4, W5, W6, W7, W8, W9, W10]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 完成后能做什么
      description: 写可观察结果，不要写「本周大家一起」。对照 docs/17-weekly-board.md。
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: 允许改的路径
      value: |
        - backend/src/main/java/com/shu/campusbuddy/
        - miniprogram/
        - web/
        - contracts/
