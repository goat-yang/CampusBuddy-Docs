server:
  port: 8080
spring:
  application:
    name: campusbuddy
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/campusbuddy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:campusbuddy}
    password: ${MYSQL_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level requestId=%X{requestId:-} %logger{36} %msg%n"
campusbuddy:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-sec: 7200
    refresh-ttl-sec: 1209600
  otp:
    ttl-sec: 300
    resend-sec: 60
    redis-host: ${SPRING_DATA_REDIS_HOST:}
    redis-port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    from: ${MAIL_USERNAME:noreply@localhost}
  wechat:
    app-id: ${WX_APPID:}
    secret: ${WX_SECRET:}
  demo:
    campus-id: ${DEMO_CAMPUS_ID:}
    password: ${DEMO_PASSWORD:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
