openapi: 3.0.3
info:
  title: CampusBuddy API
  version: "1.0.0"
  description: |
    字段、类型、枚举、HTTP 与业务 `code` 的唯一真源。
    行为与状态机见 docs/04-api-contract.md。Agent 规则见 contracts/AGENT_CONTRACT.md。
    未实现业务前，本文件仍是客户端与服务端必须对齐的合同。
    时间一律 `yyyy-MM-dd HH:mm:ss`（北京时间），禁止 ISO-8601。
    请求 JSON 默认 additionalProperties=false。
  x-owners:
    A: auth, users.me, health, common envelope
    B: activities, enrollments, files, favorites
    C: reco, admin.reco.config
    D: credit, notifications, reviews, reports, admin except reco config
    E: miniprogram consumer
    F: web portal and admin consumer
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local skeleton
tags:
  - name: health
    x-owner: A
  - name: auth
    x-owner: A
  - name: users
    x-owner: A
  - name: activities
    x-owner: B
  - name: enrollments
    x-owner: B
  - name: reco
    x-owner: C
  - name: credit
    x-owner: D
  - name: notifications
    x-owner: D
  - name: reviews
    x-owner: D
  - name: reports
    x-owner: D
  - name: admin
    x-owner: D

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      x-owner: A
      security: []
      summary: Process liveness. Not a business capability.
      responses:
        "200":
          description: Process up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /auth/otp/send:
    post:
      tags: [auth]
      operationId: sendOtp
      x-owner: A
      security: []
      summary: Send SHU-email OTP. SMS channel is rejected in V1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
            examples:
              email:
                $ref: "#/components/examples/OtpSendRequest"
      responses:
        "200":
          description: OTP accepted for send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      x-owner: A
      security: []
      summary: Login. Never accept school SSO password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      x-owner: A
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    get:
      tags: [users]
      operationId: getMe
      x-owner: A
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [users]
      operationId: updateMe
      x-owner: A
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/interests:
    get:
      tags: [users]
      operationId: getMyInterests
      x-owner: A
      responses:
        "200":
          description: Interest tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [users]
      operationId: updateMyInterests
      x-owner: A
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInterestsRequest"
      responses:
        "200":
          description: Updated interests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestsEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/profile:
    get:
      tags: [users]
      operationId: getPublicProfile
      x-owner: A
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Public profile. No campusId, email, phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /activities:
    get:
      tags: [activities]
      operationId: listActivities
      x-owner: B
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ActivityType"
        - name: tag
          in: query
          schema:
            type: string
        - name: campus
          in: query
          schema:
            $ref: "#/components/schemas/Campus"
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 40
        - name: timeRange
          in: query
          schema:
            $ref: "#/components/schemas/TimeRange"
        - name: startFrom
          in: query
          description: Required when timeRange=custom
          schema:
            $ref: "#/components/schemas/DateTimeString"
        - name: startTo
          in: query
          schema:
            $ref: "#/components/schemas/DateTimeString"
        - name: minCredit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ActivitySort"
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Public list. Only PUBLISHED or SIGNUP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCardPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [activities]
      operationId: createActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityWriteRequest"
            examples:
              create:
                $ref: "#/components/examples/ActivityCreateRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCreatedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /activities/hot:
    get:
      tags: [activities]
      operationId: listHotActivities
      x-owner: B
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Hot list from Redis ZSet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCardListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activities/{id}:
    get:
      tags: [activities]
      operationId: getActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [activities]
      operationId: updateActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityWriteRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /activities/{id}/offline:
    patch:
      tags: [activities]
      operationId: offlineActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineRequest"
      responses:
        "200":
          description: Offlined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityStatusEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /activities/{id}/enroll:
    post:
      tags: [enrollments]
      operationId: enrollActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrolled or waitlisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [enrollments]
      operationId: cancelEnroll
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Canceled. May promote waitlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelEnrollEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /activities/{id}/enrollments:
    get:
      tags: [enrollments]
      operationId: listEnrollments
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Publisher or admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /enrollments/{id}/audit:
    post:
      tags: [enrollments]
      operationId: auditEnrollment
      x-owner: B
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentAuditRequest"
      responses:
        "200":
          description: Audited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /activities/{id}/sign:
    post:
      tags: [enrollments]
      operationId: signActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRequest"
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /activities/{id}/finish:
    post:
      tags: [enrollments]
      operationId: finishActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishRequest"
      responses:
        "200":
          description: Finished and credit settled by calling D
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /files/image:
    post:
      tags: [activities]
      operationId: uploadImage
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg/png ≤ 2MB
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/activities:
    get:
      tags: [activities]
      operationId: listMyActivities
      x-owner: B
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [published, enrolled]
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: My published or enrolled cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCardPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reco/for-you:
    get:
      tags: [reco]
      operationId: recoForYou
      x-owner: C
      parameters:
        - name: scene
          in: query
          required: true
          schema:
            type: string
            enum: [home, search]
        - name: campus
          in: query
          schema:
            $ref: "#/components/schemas/Campus"
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ranked list. degraded=true is still success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reco/reasons/{activityId}:
    get:
      tags: [reco]
      operationId: recoReasons
      x-owner: C
      parameters:
        - $ref: "#/components/parameters/ActivityIdPath"
      responses:
        "200":
          description: Explainable factors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoReasonEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reco/similar/{activityId}:
    get:
      tags: [reco]
      operationId: recoSimilar
      x-owner: C
      parameters:
        - $ref: "#/components/parameters/ActivityIdPath"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Similar cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCardListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reco/candidates/{activityId}:
    get:
      tags: [reco]
      operationId: recoCandidates
      x-owner: C
      parameters:
        - $ref: "#/components/parameters/ActivityIdPath"
      responses:
        "200":
          description: P2 publisher candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBriefListEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reco/invite:
    post:
      tags: [reco]
      operationId: recoInvite
      x-owner: C
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoInviteRequest"
      responses:
        "200":
          description: P2 invites sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reco/event:
    post:
      tags: [reco]
      operationId: recoEvent
      x-owner: C
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoEventRequest"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reco/refresh:
    post:
      tags: [reco]
      operationId: recoRefresh
      x-owner: C
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: User cache cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/credit/logs:
    get:
      tags: [credit]
      operationId: listMyCreditLogs
      x-owner: D
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Ledger only, never a direct score update view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLogPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /credit/rule:
    get:
      tags: [credit]
      operationId: getCreditRule
      x-owner: D
      responses:
        "200":
          description: Public rule numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditRuleEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      x-owner: D
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Inbox plus unreadCount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{id}/read:
    patch:
      tags: [notifications]
      operationId: readNotification
      x-owner: D
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadFlagEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/subscribe:
    post:
      tags: [notifications]
      operationId: subscribeNotifications
      x-owner: D
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: Mini program template ids stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /favorites/{id}:
    post:
      tags: [activities]
      operationId: favoriteActivity
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Favorited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /favorites:
    get:
      tags: [activities]
      operationId: listFavorites
      x-owner: B
      parameters:
        - $ref: "#/components/parameters/PageNum"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Favorite cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCardPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reviews:
    post:
      tags: [reviews]
      operationId: createReview
      x-owner: D
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /activities/{id}/reviews:
    get:
      tags: [reviews]
      operationId: listActivityReviews
