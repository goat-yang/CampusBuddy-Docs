components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PageNum:
      name: pageNum
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ActivityId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ActivityIdPath:
      name: activityId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: "code=40001"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40001
            message: "email 必须是学校邮箱域"
            data:
              field: email
              retryable: false
            requestId: "22222222-2222-4222-8222-222222222222"
    Unauthorized:
      description: "code=40100"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40100
            message: 未登录或令牌已过期
            data:
              retryable: false
            requestId: "33333333-3333-4333-8333-333333333333"
    Forbidden:
      description: "code=40300"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40300
            message: 未绑定学号，无法报名或发布
            data:
              retryable: false
            requestId: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
    NotFound:
      description: "code=40400 对象不存在或不属于当前用户"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40400
            message: 资源不存在
            data: null
            requestId: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
    Conflict:
      description: "40901 status; 40902 duplicate enroll; 40903 full; 40904 time clash; 40905 idempotency mismatch"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            full:
              value:
                code: 40903
                message: 活动已满员
                data:
                  field: remainCount
                  retryable: false
                requestId: "44444444-4444-4444-8444-444444444444"
            clash:
              value:
                code: 40904
                message: "时间冲突：今晚宝山操场跑步 2026-10-20 19:30:00"
                data:
                  field: startTime
                  retryable: false
                requestId: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
    RateLimited:
      description: "code=42900"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 42900
            message: 验证码发送过于频繁，请 60 秒后重试
            data:
              field: otp
              retryable: true
              retryAfterSec: 60
            requestId: "55555555-5555-4555-8555-555555555555"
  examples:
    OtpSendRequest:
      value:
        channel: EMAIL
        campusId: "24123456"
        email: 24123456@shu.edu.cn
    ActivityCreateRequest:
      value:
        title: 今晚宝山操场跑步
        type: SPORT
        tagIds: [1, 2]
        description: 轻松慢跑 5 公里
        campus: BAOSHAN
        place: 操场
        placeNote: 西门集合
        startTime: "2026-10-20 19:30:00"
        endTime: "2026-10-20 21:00:00"
        enrollDeadline: "2026-10-20 19:00:00"
        minNum: 3
        maxNum: 8
        imageUrls: []
        status: PENDING
  schemas:
    DateTimeString:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
      example: "2026-10-20 19:30:00"
      description: Beijing time. Not ISO-8601.
    ActivityType:
      type: string
      enum: [MEAL, SPORT, STUDY, TRIP, CONTEST, FUN, OTHER]
    Campus:
      type: string
      enum: [BAOSHAN, YANCHANG, JIADING, OTHER]
    CreditLevel:
      type: string
      enum: [EXCELLENT, GOOD, NORMAL, RESTRICTED]
    ActivityStatus:
      type: string
      enum: [DRAFT, PENDING, REJECTED, PUBLISHED, SIGNUP, GROUPED, ONGOING, FINISHED, OFFLINE]
    EnrollmentStatus:
      type: string
      enum: [APPLYING, APPROVED, WAITLIST, REJECTED, CANCELED, NOSHOW, DONE]
    TimeRange:
      type: string
      enum: [tonight, tomorrow, week, custom]
    ActivitySort:
      type: string
      enum: [time, hot, credit, distance]
    ErrorData:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        retryable:
          type: boolean
        retryAfterSec:
          type: integer
          minimum: 1
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, requestId]
      properties:
        code:
          type: integer
          enum: [40001, 40100, 40300, 40400, 40901, 40902, 40903, 40904, 40905, 42900, 50000]
        message:
          type: string
        data:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ErrorData"
        requestId:
          type: string
          format: uuid
    UserBrief:
      type: object
      additionalProperties: false
      required: [id, nickname, avatar, creditScore, creditLevel, college]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatar:
          nullable: true
          type: string
        creditScore:
          type: integer
          minimum: 0
          maximum: 100
        creditLevel:
          $ref: "#/components/schemas/CreditLevel"
        college:
          nullable: true
          type: string
    ActivityCard:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - type
        - tags
        - campus
        - place
        - startTime
        - endTime
        - enrollDeadline
        - minNum
        - maxNum
        - enrollNum
        - remainCount
        - status
        - cover
        - publisher
        - reason
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        type:
          $ref: "#/components/schemas/ActivityType"
        tags:
          type: array
          items:
            type: string
        campus:
          $ref: "#/components/schemas/Campus"
        place:
          type: string
        startTime:
          $ref: "#/components/schemas/DateTimeString"
        endTime:
          $ref: "#/components/schemas/DateTimeString"
        enrollDeadline:
          $ref: "#/components/schemas/DateTimeString"
        minNum:
          type: integer
        maxNum:
          type: integer
        enrollNum:
          type: integer
        remainCount:
          type: integer
        status:
          $ref: "#/components/schemas/ActivityStatus"
        cover:
          nullable: true
          type: string
        publisher:
          $ref: "#/components/schemas/UserBrief"
        reason:
          nullable: true
          type: string
          description: Non-null only on reco endpoints. List endpoints must send null.
    ActivityDetail:
      allOf:
        - $ref: "#/components/schemas/ActivityCard"
        - type: object
          additionalProperties: false
          required: [description, images, publisherProfile, myEnrollmentStatus, waitNum]
          properties:
            description:
              type: string
            images:
              type: array
              items:
                type: string
            publisherProfile:
              $ref: "#/components/schemas/UserBrief"
            myEnrollmentStatus:
              nullable: true
              $ref: "#/components/schemas/EnrollmentStatus"
            waitNum:
              type: integer
    Enrollment:
      type: object
      additionalProperties: false
      required: [id, activityId, user, status, applyMsg, signupTime]
      properties:
        id:
          type: integer
          format: int64
        activityId:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserBrief"
        status:
          $ref: "#/components/schemas/EnrollmentStatus"
        applyMsg:
          nullable: true
          type: string
        signupTime:
          $ref: "#/components/schemas/DateTimeString"
    HealthData:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [UP]
        service:
          type: string
          enum: [campusbuddy]
    OtpSendRequest:
      type: object
      additionalProperties: false
      required: [channel, campusId, email]
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS]
          description: V1 must reject SMS with 40001
        campusId:
          type: string
          pattern: "^[A-Za-z0-9]{5,20}$"
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      additionalProperties: false
      required: [mode]
      description: |
        CAMPUS_PASSWORD requires campusId+password (platform password only).
        CAMPUS_OTP requires campusId+email+otp; password required if the campusId has no platform password yet.
        WECHAT requires code; unbound campusId may browse but enroll/publish returns 40300.
        SHU_OAUTH is not a valid mode in V1.
      properties:
        mode:
          type: string
          enum: [CAMPUS_PASSWORD, CAMPUS_OTP, WECHAT]
        campusId:
          type: string
        password:
          type: string
          description: Platform password only. Never school SSO password.
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: "^\\d{6}$"
        code:
          type: string
          description: WeChat login code when mode=WECHAT
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenData:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          maximum: 7200
        user:
          $ref: "#/components/schemas/UserBrief"
    Me:
      allOf:
        - $ref: "#/components/schemas/UserBrief"
        - type: object
          additionalProperties: false
          required: [campusIdMasked, grade, major, campus, bio, emailMasked]
          properties:
            campusIdMasked:
              type: string
              example: "2412****"
            grade:
              nullable: true
              type: string
            major:
              nullable: true
              type: string
            campus:
              nullable: true
              $ref: "#/components/schemas/Campus"
            bio:
              nullable: true
              type: string
            emailMasked:
              type: string
              example: "2412****@shu.edu.cn"
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required: [nickname, avatar, college, grade, major, campus, bio]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        avatar:
          nullable: true
          type: string
        college:
          nullable: true
          type: string
        grade:
          nullable: true
          type: string
        major:
          nullable: true
          type: string
        campus:
          nullable: true
          $ref: "#/components/schemas/Campus"
        bio:
          nullable: true
          type: string
          maxLength: 200
    Tag:
      type: object
      additionalProperties: false
      required: [id, name, category]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
    Interests:
      type: object
      additionalProperties: false
      required: [tagIds, tags]
      properties:
        tagIds:
          type: array
          minItems: 3
          maxItems: 10
          items:
            type: integer
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    UpdateInterestsRequest:
      type: object
      additionalProperties: false
      required: [tagIds]
      properties:
        tagIds:
          type: array
          minItems: 3
          maxItems: 10
          items:
            type: integer
    PublicProfile:
      allOf:
        - $ref: "#/components/schemas/UserBrief"
        - type: object
          additionalProperties: false
          required: [historyCount, reviewSummary]
          properties:
            historyCount:
              type: integer
            reviewSummary:
              type: object
              additionalProperties: false
              required: [avgScore, count]
              properties:
                avgScore:
                  type: number
                  format: float
                count:
                  type: integer
    ActivityWriteRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - type
        - tagIds
        - description
        - campus
        - place
        - startTime
        - endTime
        - enrollDeadline
        - minNum
        - maxNum
        - imageUrls
        - status
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 40
        type:
          $ref: "#/components/schemas/ActivityType"
        tagIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: integer
        description:
          type: string
          maxLength: 2000
        campus:
          $ref: "#/components/schemas/Campus"
        place:
          type: string
          maxLength: 40
        placeNote:
          type: string
          maxLength: 80
        startTime:
          $ref: "#/components/schemas/DateTimeString"
        endTime:
          $ref: "#/components/schemas/DateTimeString"
        enrollDeadline:
          $ref: "#/components/schemas/DateTimeString"
        minNum:
          type: integer
          minimum: 2
        maxNum:
          type: integer
          minimum: 2
          maximum: 20
        imageUrls:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [DRAFT, PENDING]
    OfflineRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
    EnrollRequest:
      type: object
      additionalProperties: false
      required: [applyMsg]
      properties:
        applyMsg:
          type: string
          maxLength: 200
    EnrollmentAuditRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT, REMOVE]
        reason:
          type: string
          maxLength: 200
    SignRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    FinishRequest:
      type: object
      additionalProperties: false
      required: [presentUserIds]
      properties:
        presentUserIds:
          type: array
          items:
            type: integer
            format: int64
    RecoInviteRequest:
      type: object
      additionalProperties: false
      required: [activityId, userIds]
      properties:
        activityId:
          type: integer
          format: int64
        userIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    RecoEventRequest:
      type: object
      additionalProperties: false
      required: [batchId, activityId, eventType, position, scene]
      properties:
        batchId:
          type: string
        activityId:
          type: integer
          format: int64
        eventType:
          type: string
          enum: [EXPOSE, CLICK, SIGNUP, IGNORE, DISLIKE]
        position:
          type: integer
          minimum: 0
        scene:
          type: string
          enum: [home, search]
    RecoFactors:
      type: object
      additionalProperties: false
      required: [tag, time, geo, credit, hot, cf]
      properties:
        tag:
